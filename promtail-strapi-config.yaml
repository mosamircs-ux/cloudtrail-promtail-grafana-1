# Promtail config for EC2 running Strapi (PM2) - merge with promtail-ec2-config or use standalone
#
# 1. Set STRAPI_LOG_PATH and STRAPI_ERROR_PATH (setup-strapi-promtail.sh fills these)
#    STRAPI_LOG_PATH  = main logs (out + all), e.g. /home/ubuntu/.pm2/logs/strapi-ceramic*.log
#    STRAPI_ERROR_PATH = error logs only, e.g. /home/ubuntu/.pm2/logs/strapi-ceramic-error.log
#
# 2. Deploy: run setup-strapi-promtail.sh (auto-detects path)

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://157.175.59.166:3100/loki/api/v1/push
    # Change to your Loki server IP

scrape_configs:
  # System syslog (Ubuntu)
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          instance: INSTANCE_ID
          __path__: /var/log/syslog
    pipeline_stages: []

  # Strapi / PM2 stdout logs (Pino JSON)
  # Pino levels: 10=trace, 20=debug, 30=info, 40=warn, 50=error, 60=fatal
  - job_name: strapi
    static_configs:
      - targets:
          - localhost
        labels:
          job: strapi
          instance: INSTANCE_ID
          __path__: STRAPI_LOG_PATH
    pipeline_stages:
      - json:
          expressions:
            level: level
            time: time
            msg: msg
      - labels:
          level:

  # Strapi / PM2 error logs (stderr) - unique job_name required by Promtail, labels still job:strapi for Loki
  - job_name: strapi-errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: strapi
          instance: INSTANCE_ID
          __path__: STRAPI_ERROR_PATH
    pipeline_stages:
      - json:
          expressions:
            level: level
            time: time
            msg: msg
