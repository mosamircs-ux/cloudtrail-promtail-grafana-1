# Promtail config for EC2 running Strapi (PM2) - merge with promtail-ec2-config or use standalone
#
# 1. Set STRAPI_LOG_PATH - full glob path to PM2 logs, e.g.:
#    - /home/ubuntu/.pm2/logs/strapi*.log   (Strapi app named "strapi")
#    - /home/ec2-user/.pm2/logs/*.log       (all PM2 apps)
#
# 2. Deploy: run setup-strapi-promtail.sh (auto-detects path) or:
#    sed -i "s|STRAPI_LOG_PATH|/home/ubuntu/.pm2/logs/strapi*.log|g; s/INSTANCE_ID/$(hostname)/" promtail-strapi-config.yaml

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://157.175.59.166:3100/loki/api/v1/push
    # Change to your Loki server IP

scrape_configs:
  # System syslog (Ubuntu)
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          instance: INSTANCE_ID
          __path__: /var/log/syslog
    pipeline_stages: []

  # Strapi / PM2 logs (Pino JSON: {"level":30,"time":...,"msg":"..."})
  # Pino levels: 10=trace, 20=debug, 30=info, 40=warn, 50=error, 60=fatal
  - job_name: strapi
    static_configs:
      - targets:
          - localhost
        labels:
          job: strapi
          instance: INSTANCE_ID
          __path__: STRAPI_LOG_PATH
    pipeline_stages:
      - json:
          expressions:
            level: level
            time: time
            msg: msg
      - labels:
          level:
