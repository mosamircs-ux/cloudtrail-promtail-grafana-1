# Add this to your existing Grafana Docker setup to enable alerting
# Use: docker-compose -f docker-compose.grafana.yaml -f your-existing-compose.yaml up -d
#
# Or merge the volumes and env into your existing grafana service

services:
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    environment:
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${SMTP_USER:-your-email@gmail.com}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_USER:-your-email@gmail.com}
      - GF_SMTP_FROM_NAME=Grafana Alerts
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ALERTING_ENABLED=true
    restart: unless-stopped

volumes:
  grafana-data: {}
