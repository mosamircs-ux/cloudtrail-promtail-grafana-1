# Promtail config for EC2 running Laravel - merge with promtail-ec2-config or use standalone
#
# 1. Set LARAVEL_LOG_PATH - typical paths:
#    - /var/www/html/storage/logs     (LAMP)
#    - /home/ubuntu/app/storage/logs  (Laravel on Ubuntu)
#    - /var/www/laravel/storage/logs
#
# 2. Deploy: sed -i "s|LARAVEL_LOG_PATH|/var/www/html/storage/logs|g; s/INSTANCE_ID/$(hostname)/" promtail-laravel-config.yaml

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://16.24.169.121:3100/loki/api/v1/push
    # Change to your Loki server IP

scrape_configs:
  - job_name: laravel
    static_configs:
      - targets:
          - localhost
        labels:
          job: laravel
          instance: INSTANCE_ID
          __path__: LARAVEL_LOG_PATH/*.log
    pipeline_stages:
      - regex:
          expression: '^\[(?P<timestamp>[^\]]+)\]\s+(?P<env>\w+)\.(?P<level>\w+):\s+(?P<message>.*)'
      - labels:
          level:
          env:
