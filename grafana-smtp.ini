# Grafana SMTP Configuration - Add to your grafana.ini or set as environment variables
#
# For Docker: Add environment variables to your Grafana container:
#   GF_SMTP_ENABLED=true
#   GF_SMTP_HOST=smtp.gmail.com:587
#   GF_SMTP_USER=your-email@gmail.com
#   GF_SMTP_PASSWORD=your-app-password
#   GF_SMTP_FROM_ADDRESS=your-email@gmail.com
#   GF_SMTP_FROM_NAME=Grafana Alerts
#
# Gmail: Use App Password (not regular password) - Google Account → Security → App passwords
# Outlook: smtp.office365.com:587
# SendGrid: smtp.sendgrid.net:587
# AWS SES: email-smtp.region.amazonaws.com:587

[smtp]
enabled = true
host = smtp.gmail.com:587
user = your-email@gmail.com
; Use app password for Gmail
password = your-app-password
from_address = your-email@gmail.com
from_name = Grafana Alerts
; Set to true if your SMTP server requires TLS
skips_verify = false
